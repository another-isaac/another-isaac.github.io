<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  {%- if page.description -%}
  <meta name="description" content="{{ page.description | strip_html | strip_newlines | truncate: 160 }}">
  {%- elsif site.description -%}
  <meta name="description" content="{{ site.description | strip_html | strip_newlines | truncate: 160 }}">
  {%- endif -%}

  <link rel="icon" type="image/svg+xml" href="{{ "/assets/img/favicon.svg" | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/img/favicon-32x32.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/img/favicon-16x16.png" | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/img/apple-touch-icon.png" | relative_url }}">
  <link rel="shortcut icon" href="{{ "/assets/img/favicon.ico" | relative_url }}">

  <link rel="stylesheet" href="https://unpkg.com/@sakun/system.css@0.1.11/dist/system.css">
  <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}">
  {%- feed_meta -%}
</head>
